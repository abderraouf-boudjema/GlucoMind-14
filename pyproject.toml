[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucofind-ai"
version = "1.0.0"
description = "GlucoMind-14: physiologically grounded glucose-insulin simulator for Type 1 Diabetes under MDI therapy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GlucoMind AI" },
]
keywords = [
    "type-1-diabetes",
    "glucose-insulin-model",
    "diabetes-simulation",
    "biomedical-modeling",
    "ODE",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/abderraouf-boudjema/GlucoMind-14"
Documentation = "https://github.com/abderraouf-boudjema/GlucoMind-14#readme"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
